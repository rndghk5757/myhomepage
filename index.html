<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 업무 도구 모음</title>
<!-- 글꼴: Noto Sans KR (글꼴 파일만 불러오고, 그 밖의 외부 라이브러리는 쓰지 않음) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     1. 색상 토큰 (공통 조건)
     - 눈이 편한 연한 세이지 배경 + 남색(#1f3a6d) 포인트
     ========================================================= */
  :root {
    --bg: #E9EEE6;          /* 페이지 배경 */
    --panel: #F6F8F3;       /* 카드 배경 */
    --field: #FBFCF9;       /* 입력창 배경 */
    --navy: #1F3A6D;        /* 포인트 색 */
    --navy-dark: #162B52;   /* 버튼에 마우스를 올렸을 때 */
    --soft: #DFE7E2;        /* 연한 강조 바탕 */
    --ink: #26322E;         /* 기본 글씨 */
    --ink-soft: #5F6D66;    /* 보조 글씨 */
    --line: #D3DCCF;        /* 테두리·구분선 */
    --warn: #A4471F;        /* 안내·경고 */
    --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

    /* 휴대폰 상단·하단 시스템 영역에 내용이 가리지 않도록 여백 */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); }

  body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    background: var(--bg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 20px 28px;
  }

  /* =========================================================
     2. 위쪽: 제목, 부제, 검색창
     ========================================================= */
  header { margin-bottom: 28px; }
  h1 {
    margin: 0;
    font-weight: 900;
    font-size: clamp(2rem, 6vw, 2.9rem);
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--navy);
  }
  .subtitle {
    margin: 8px 0 22px;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }

  .search {
    position: relative;
    max-width: 480px;
  }
  /* 돋보기 모양(외부 아이콘 없이 CSS로 그림) */
  .search::before {
    content: "";
    position: absolute;
    left: 16px;
    top: 50%;
    width: 13px;
    height: 13px;
    border: 2px solid var(--ink-soft);
    border-radius: 50%;
    transform: translateY(-62%);
    pointer-events: none;
  }
  .search::after {
    content: "";
    position: absolute;
    left: 28px;
    top: 50%;
    width: 2px;
    height: 7px;
    background: var(--ink-soft);
    transform: translateY(1px) rotate(-45deg);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid #BFCBBC;
    border-radius: 14px;
    padding: 12px 16px 12px 44px;
  }
  .search input::placeholder { color: #8E9A93; }
  .search input:focus-visible {
    outline: 3px solid var(--navy);
    outline-offset: 2px;
  }

  /* =========================================================
     3. 가운데: 도구 카드 격자
     ========================================================= */
  .grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 22px 20px;
    box-shadow: 0 2px 10px rgba(52, 72, 60, 0.07);
    /* 마우스를 올렸을 때 부드럽게 떠오르도록 */
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(52, 72, 60, 0.14);
  }

  .emoji {
    font-size: 2.8rem;
    line-height: 1;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
  }
  .card p {
    margin: 6px 0 18px;
    color: var(--ink-soft);
    font-size: .95rem;
    flex: 1;                /* 설명이 짧아도 버튼이 카드 아래에 맞춰지도록 */
  }

  /* "준비 중" 배지: 카드 오른쪽 위 */
  .badge {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: .78rem;
    font-weight: 700;
    color: var(--warn);
    background: #F1E4DC;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .card.not-ready .emoji,
  .card.not-ready h2 { opacity: .7; }

  /* [열기] 버튼 */
  .open {
    align-self: flex-start;
    display: inline-block;
    text-decoration: none;
    font-weight: 700;
    font-size: .95rem;
    color: #F6F8F3;
    background: var(--navy);
    border-radius: 12px;
    padding: 9px 22px;
    transition: background-color .12s ease;
  }
  .open:hover { background: var(--navy-dark); }
  .open:focus-visible {
    outline: 3px solid var(--navy);
    outline-offset: 2px;
  }
  /* 준비 중인 도구의 버튼: 누를 수 없게 흐리게 */
  .open[aria-disabled="true"] {
    background: var(--soft);
    color: #8E9A93;
    cursor: not-allowed;
  }

  /* 검색 결과가 없을 때 */
  .empty {
    margin: 8px 0 0;
    padding: 36px 20px;
    text-align: center;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px dashed #BFCBBC;
    border-radius: 20px;
  }
  .empty[hidden] { display: none; }

  /* =========================================================
     4. 맨 아래
     ========================================================= */
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: .85rem;
    color: var(--ink-soft);
  }
  footer p { margin: 0; }
  footer .note {
    margin-top: 6px;
    font-size: .78rem;
    color: #7D8A83;
  }

  /* =========================================================
     5. 휴대폰 화면: 카드 한 줄에 하나
     ========================================================= */
  @media (max-width: 560px) {
    .wrap { padding: 28px 14px 22px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .search { max-width: none; }
  }

  /* 움직임 줄이기 설정을 켠 사용자에게는 떠오르는 효과를 끔 */
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- ===== 위쪽: 제목, 부제, 검색창 ===== -->
  <header>
    <h1>나의 업무 도구 모음</h1>
    <p class="subtitle">바이브 코딩으로 직접 만든 업무 도우미</p>
    <div class="search">
      <label for="search-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">도구 검색</label>
      <input id="search-input" type="search" placeholder="도구 이름이나 설명으로 찾기" autocomplete="off">
    </div>
  </header>

  <!-- ===== 가운데: 도구 카드 격자 (스크립트가 채움) ===== -->
  <main>
    <ul id="tool-grid" class="grid" aria-label="도구 목록"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <!-- ===== 맨 아래 ===== -->
  <footer>
    <p id="credit"></p>
    <p class="note">입력한 내용은 이 브라우저 안에서만 처리되며 어디에도 저장·전송되지 않습니다.</p>
  </footer>
</div>

<script>
/* =============================================================
   설정값 — 이 부분만 고치면 됩니다.
   ============================================================= */

// 만든 사람 이름 (맨 아래 문구에 들어감)
const AUTHOR = "○○○";

/*
 * 도구 목록
 * - 한 줄을 추가하면 카드가 하나 생깁니다.
 * - ready: false 이면 "준비 중" 배지가 붙고 [열기] 버튼이 눌리지 않습니다.
 */
const TOOLS = [
  { emoji: "🍱", name: "점심 메뉴 룰렛",     desc: "오늘 점심을 대신 정해 드려요",              url: "lunch.html",     ready: true  },
  { emoji: "📄", name: "PDF 병합·분할기",    desc: "여러 PDF를 합치고 나눠요",                  url: "pdf.html",       ready: true  },
  { emoji: "📊", name: "자동 데이터 분석기", desc: "파일만 넣으면 분석하고 차트를 추천해요",    url: "analyzer.html",  ready: false },
  { emoji: "⚡", name: "전력수요 대시보드",  desc: "공공데이터로 본 우리나라 전력 사용",        url: "dashboard.html", ready: false },
];

/* =============================================================
   화면 요소
   ============================================================= */
const grid    = document.getElementById("tool-grid");
const emptyEl = document.getElementById("empty");
const search  = document.getElementById("search-input");

// 맨 아래 만든 사람 문구
document.getElementById("credit").textContent = `만든 사람: ${AUTHOR} · 2026 바이브 코딩 실습`;

/* =============================================================
   카드 만들기
   - textContent로 글자를 넣어 HTML 태그가 실행되지 않게 합니다.
   ============================================================= */
function makeCard(tool) {
  const li = document.createElement("li");
  li.className = "card" + (tool.ready ? "" : " not-ready");

  const emoji = document.createElement("div");
  emoji.className = "emoji";
  emoji.setAttribute("aria-hidden", "true");
  emoji.textContent = tool.emoji;

  const title = document.createElement("h2");
  title.textContent = tool.name;

  const desc = document.createElement("p");
  desc.textContent = tool.desc;

  // [열기] 버튼: 준비된 도구는 링크, 준비 중인 도구는 눌리지 않는 표시
  const open = document.createElement("a");
  open.className = "open";
  open.textContent = "열기";
  if (tool.ready) {
    open.href = tool.url;
    open.setAttribute("aria-label", `${tool.name} 열기`);
  } else {
    open.setAttribute("aria-disabled", "true");
    open.setAttribute("aria-label", `${tool.name} (준비 중)`);
    open.addEventListener("click", (e) => e.preventDefault());
  }

  li.append(emoji, title, desc, open);

  // "준비 중" 배지
  if (!tool.ready) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "준비 중";
    li.appendChild(badge);
  }
  return li;
}

/* =============================================================
   목록 그리기 + 검색
   - 검색어가 도구 이름이나 설명에 들어 있으면 보여 줍니다.
   - 띄어쓰기와 영문 대소문자는 무시하고 비교합니다.
   ============================================================= */
const normalize = (str) => str.toLowerCase().replace(/\s+/g, "");

function render() {
  const query = normalize(search.value);
  const matched = TOOLS.filter((t) =>
    !query || normalize(t.name + t.desc).includes(query)
  );

  grid.innerHTML = "";
  matched.forEach((t) => grid.appendChild(makeCard(t)));

  // 검색 결과가 없을 때 안내
  if (matched.length === 0) {
    emptyEl.textContent = `"${search.value.trim()}"에 맞는 도구가 없어요. 다른 낱말로 찾아보세요.`;
    emptyEl.hidden = false;
  } else {
    emptyEl.hidden = true;
  }
}

search.addEventListener("input", render);

/* ---------- 처음 화면 준비 ---------- */
render();
</script>
</body>
</html>
